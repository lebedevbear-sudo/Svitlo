<style>
/* Layout: one narrow column like a phone app — status first, then today's 48 half-hour cells, tomorrow, weekly plan. */
:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --ink: #1B222B;
  --muted: #5D6774;
  --line: #DCE1E7;
  --on: #F4B400;
  --on-ink: #3B2B00;
  --on-soft: #FFF3C9;
  --off: #2B3542;
  --off-ink: #F3F5F7;
  --maybe-a: #F4B400;
  --maybe-b: #FFFFFF;
  --unknown: #C8CED6;
  --focus: #2563EB;
  --display: "Unbounded", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1318; --surface: #181E26; --ink: #E8ECF1; --muted: #98A3B0; --line: #29313C;
    --on: #F4B400; --on-ink: #2A1F00; --on-soft: #33290D; --off: #05080B; --off-ink: #E8ECF1;
    --maybe-a: #C99500; --maybe-b: #181E26; --unknown: #3A4350; --focus: #7FA8FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1318; --surface: #181E26; --ink: #E8ECF1; --muted: #98A3B0; --line: #29313C;
  --on: #F4B400; --on-ink: #2A1F00; --on-soft: #33290D; --off: #05080B; --off-ink: #E8ECF1;
  --maybe-a: #C99500; --maybe-b: #181E26; --unknown: #3A4350; --focus: #7FA8FF; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 500; }
.mono, time, .t { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header { display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.bulb { width: 14px; height: 14px; border-radius: 50%; background: var(--on); box-shadow: 0 0 0 4px var(--on-soft); flex: none; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
select {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 14px; min-width: 150px;
}

.status {
  border-radius: 18px; padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 6px;
  background: var(--surface); border: 1px solid var(--line);
}
.status[data-s="on"] { background: var(--on); color: var(--on-ink); border-color: var(--on); }
.status[data-s="off"] { background: var(--off); color: var(--off-ink); border-color: var(--off); }
.status[data-s="maybe"] { background: repeating-linear-gradient(135deg, var(--on-soft) 0 14px, var(--surface) 14px 28px); }
.status .label { color: inherit; opacity: 0.75; }
.status .big { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 7vw, 40px); line-height: 1.1; letter-spacing: -0.02em; }
.status .next { font-size: 16px; font-weight: 600; }
.status .src { font-size: 13px; opacity: 0.8; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.fact { border-color: var(--ink); color: var(--ink); }

.bar { position: relative; padding-bottom: 18px; }
.cells { display: grid; grid-template-columns: repeat(48, 1fr); gap: 1px; height: 40px; border-radius: 8px; overflow: hidden; background: var(--line); }
.c { background: var(--unknown); }
.c.on { background: var(--on); }
.c.off { background: var(--off); }
.c.maybe { background: repeating-linear-gradient(135deg, var(--maybe-a) 0 3px, var(--maybe-b) 3px 6px); }
.c.past { opacity: 0.55; }
.ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; font-size: 11px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); font-family: var(--mono); }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
.now { position: absolute; top: -4px; height: 48px; width: 2px; background: var(--focus); border-radius: 2px; }
.now::before { content: ""; position: absolute; top: -4px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--focus); }

.intervals { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.intervals li { font-family: var(--mono); font-size: 13px; padding: 3px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.intervals li.maybe { border-style: dashed; }
.sum { font-size: 14px; color: var(--muted); margin: 0; }
.sum b { color: var(--ink); }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

.week { display: grid; grid-template-columns: 28px 1fr; gap: 4px 8px; align-items: center; }
.week .d { font-size: 12px; font-weight: 700; color: var(--muted); }
.week .d.today { color: var(--ink); }
.week .cells { height: 16px; border-radius: 4px; }
.week .row-today { outline: 2px solid var(--focus); outline-offset: 1px; }
.week-ticks { grid-column: 2; position: relative; height: 14px; font-size: 10px; color: var(--muted); }
.week-ticks span { position: absolute; transform: translateX(-50%); font-family: var(--mono); }
.week-ticks span:first-child { transform: none; }
.week-ticks span:last-child { transform: translateX(-100%); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }

footer { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
footer a { color: inherit; }
.mode { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: #1F9D55; }

@media (prefers-reduced-motion: no-preference) {
  .status { transition: background-color .3s ease, color .3s ease; }
}
@media (max-width: 480px) {
  .cells { height: 34px; }
  .now { height: 42px; }
  .card { padding: 14px; }
}
</style>

<script>
(function () {
  "use strict";
  const TZ = "Europe/Kyiv";
  const RAW_BASE = "https://raw.githubusercontent.com/Baskerville42/outage-data-ua/main/data/";
  const REGIONS = [
    { id: "kyiv", name: "Київ" },
    { id: "kyiv-region", name: "Київщина" },
    { id: "dnipro", name: "Дніпро" },
    { id: "odesa", name: "Одеса" }
  ];
  const HALF = {
    yes: ["on", "on"], no: ["off", "off"], first: ["off", "on"], second: ["on", "off"],
    maybe: ["maybe", "maybe"], mfirst: ["maybe", "on"], msecond: ["on", "maybe"]
  };
  const DAYS_FULL = ["", "понеділок", "вівторок", "середа", "четвер", "пʼятниця", "субота", "неділя"];
  const DAYS_MINI = ["", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
  const MONTHS = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];

  let snapshot = {};
  try { snapshot = JSON.parse(document.getElementById("snapshot").textContent) || {}; } catch (e) { snapshot = {}; }
  const live = {};          // regionId -> raw json fetched live
  const liveTried = {};     // regionId -> promise
  let state = { region: "kyiv", group: null };
  try {
    const saved = JSON.parse(localStorage.getItem("svitlo-choice") || "null");
    if (saved && REGIONS.some(r => r.id === saved.region)) state = saved;
  } catch (e) {}

  // ---------- time helpers (always Kyiv time, whatever the viewer's clock zone) ----------
  const fmtParts = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  function kyiv(date) {
    const o = {};
    for (const p of fmtParts.formatToParts(date)) o[p.type] = p.value;
    return { ymd: o.year + "-" + o.month + "-" + o.day, h: +o.hour % 24, min: +o.minute };
  }
  function addDays(ymd, n) {
    const [y, m, d] = ymd.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  }
  function weekday(ymd) {
    const [y, m, d] = ymd.split("-").map(Number);
    const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    return w === 0 ? 7 : w;
  }
  function humanDate(ymd) {
    const [, m, d] = ymd.split("-").map(Number);
    return DAYS_FULL[weekday(ymd)] + ", " + d + " " + MONTHS[m - 1];
  }
  function slotTime(i) {
    if (i >= 48) return "24:00";
    const h = Math.floor(i / 2), m = (i % 2) * 30;
    return String(h).padStart(2, "0") + ":" + (m ? "30" : "00");
  }
  function duration(mins) {
    const h = Math.floor(mins / 60), m = mins % 60;
    if (h && m) return h + " год " + m + " хв";
    if (h) return h + " год";
    return m + " хв";
  }
  function stamp(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return new Intl.DateTimeFormat("uk-UA", { timeZone: TZ, day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }).format(d);
  }

  // ---------- data model ----------
  function toSlots(hours) {
    const out = [];
    for (let h = 1; h <= 24; h++) {
      const v = hours ? hours[h] : undefined;
      out.push.apply(out, HALF[v] || ["unknown", "unknown"]);
    }
    return out;
  }
  function natural(a, b) {
    const pa = a.replace(/\D+/g, " ").trim().split(" ").map(Number);
    const pb = b.replace(/\D+/g, " ").trim().split(" ").map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
    }
    return 0;
  }
  function buildModel(raw) {
    const factDays = {};
    const fd = raw && raw.fact && raw.fact.data;
    if (fd && !Array.isArray(fd) && typeof fd === "object") {
      for (const ts of Object.keys(fd)) {
        const groups = fd[ts];
        if (groups && typeof groups === "object" && Object.keys(groups).length) {
          factDays[kyiv(new Date(+ts * 1000)).ymd] = groups;
        }
      }
    }
    const preset = (raw && raw.preset && raw.preset.data && !Array.isArray(raw.preset.data)) ? raw.preset.data : {};
    const names = (raw && raw.preset && raw.preset.sch_names) || {};
    return {
      factDays, preset, names,
      factUpdate: raw && raw.fact && (raw.fact.update || raw.fact.updateFact),
      presetUpdate: raw && raw.preset && raw.preset.updateFact,
      lastUpdated: raw && raw.lastUpdated
    };
  }
  function groupsFor(model, todayYmd) {
    const today = model.factDays[todayYmd];
    const list = today ? Object.keys(today) : Object.keys(model.preset);
    const all = list.length ? list : Object.keys(model.preset);
    return all.sort(natural);
  }
  function dayView(model, group, ymd, allowPlan) {
    const f = model.factDays[ymd];
    if (f && f[group]) return { kind: "fact", slots: toSlots(f[group]) };
    if (f && !f[group]) return { kind: "nogroup", slots: null };
    const p = model.preset[group] && model.preset[group][weekday(ymd)];
    if (allowPlan && p) return { kind: "plan", slots: toSlots(p) };
    return { kind: "none", slots: null };
  }
  function intervals(slots) {
    const out = [];
    let i = 0;
    while (i < 48) {
      const s = slots[i];
      if (s === "off" || s === "maybe") {
        let j = i;
        while (j < 48 && slots[j] === s) j++;
        out.push({ s, from: i, to: j });
        i = j;
      } else i++;
    }
    return out;
  }

  // ---------- rendering ----------
  const $ = id => document.getElementById(id);
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function barNode(slots, nowSlot, nowMinutes, small) {
    const wrap = el("div", small ? "" : "bar");
    const cells = el("div", "cells");
    for (let i = 0; i < 48; i++) {
      const c = el("div", "c " + (slots ? slots[i] : "unknown") + (nowSlot != null && i < nowSlot ? " past" : ""));
      c.title = slotTime(i) + "–" + slotTime(i + 1);
      cells.appendChild(c);
    }
    wrap.appendChild(cells);
    if (!small) {
      const ticks = el("div", "ticks");
      for (let h = 0; h <= 24; h += 3) {
        const s = el("span", "", String(h).padStart(2, "0"));
        s.style.left = (h / 24 * 100) + "%";
        ticks.appendChild(s);
      }
      wrap.appendChild(ticks);
      if (nowMinutes != null) {
        const n = el("div", "now");
        n.style.left = "calc(" + (nowMinutes / 1440 * 100) + "% - 1px)";
        n.setAttribute("aria-hidden", "true");
        wrap.appendChild(n);
      }
    }
    return wrap;
  }
  function renderDay(container, title, ymd, view, now) {
    container.replaceChildren();
    const head = el("div", "card-head");
    head.appendChild(el("h2", "", title + " · " + humanDate(ymd)));
    if (view.kind === "fact") head.appendChild(el("span", "tag fact", "графік відключень"));
    else if (view.kind === "plan") head.appendChild(el("span", "tag", "лише тижневий план"));
    container.appendChild(head);

    if (!view.slots) {
      container.appendChild(barNode(null, null, now ? now.minutes : null));
      container.appendChild(el("p", "empty", view.kind === "nogroup"
        ? "Для цієї черги на цей день графіка немає."
        : "Графік на цей день ще не опубліковано."));
      return;
    }
    container.appendChild(barNode(view.slots, now ? now.slot : null, now ? now.minutes : null));
    if (view.kind === "plan") {
      container.appendChild(el("p", "empty", "Графік відключень на цей день ще не опубліковано. Смуга показує тижневий план, він може змінитися."));
    }
    const list = intervals(view.slots);
    const offMins = view.slots.filter(s => s === "off").length * 30;
    const maybeMins = view.slots.filter(s => s === "maybe").length * 30;
    if (!list.length) {
      container.appendChild(el("p", "sum", view.kind === "plan" ? "У тижневому плані відключень немає." : "Відключень не заплановано."));
      return;
    }
    const sum = el("p", "sum");
    if (offMins) { sum.append("Без світла: "); sum.appendChild(el("b", "", duration(offMins))); }
    if (maybeMins) { sum.append((offMins ? " · " : "") + "можливо без світла: "); sum.appendChild(el("b", "", duration(maybeMins))); }
    container.appendChild(sum);
    const ul = el("ul", "intervals");
    for (const it of list) {
      const li = el("li", it.s, slotTime(it.from) + "–" + slotTime(it.to));
      li.title = it.s === "off" ? "Світла немає" : "Можливе відключення";
      ul.appendChild(li);
    }
    container.appendChild(ul);
  }
  function renderWeek(model, group, todayYmd) {
    const box = $("week");
    box.replaceChildren();
    const p = model.preset[group];
    const wd = weekday(todayYmd);
    for (let d = 1; d <= 7; d++) {
      box.appendChild(el("span", "d" + (d === wd ? " today" : ""), DAYS_MINI[d]));
      const bar = barNode(p && p[d] ? toSlots(p[d]) : null, null, null, true);
      if (d === wd) bar.firstChild.classList.add("row-today");
      box.appendChild(bar);
    }
    const ticks = el("div", "week-ticks");
    for (let h = 0; h <= 24; h += 6) {
      const s = el("span", "", String(h).padStart(2, "0"));
      s.style.left = (h / 24 * 100) + "%";
      ticks.appendChild(s);
    }
    box.appendChild(ticks);
  }
  function renderStatus(todayView, tomorrowView, now) {
    const box = $("status");
    const slots = todayView.slots;
    if (!slots) {
      box.dataset.s = "unknown";
      $("st-big").textContent = "Немає даних";
      $("st-next").textContent = "Для цієї черги зараз немає ні графіка, ні тижневого плану.";
      $("st-src").textContent = "";
      return;
    }
    const cur = slots[now.slot];
    box.dataset.s = cur;
    $("st-big").textContent = cur === "on" ? "Світло є" : cur === "off" ? "Світла немає" : cur === "maybe" ? "Можливе відключення" : "Невідомо";
    const seq = slots.slice();
    const tomorrowKnown = tomorrowView.kind === "fact" && tomorrowView.slots;
    if (tomorrowKnown) seq.push.apply(seq, tomorrowView.slots);
    let j = now.slot + 1;
    while (j < seq.length && seq[j] === cur) j++;
    const minsLeft = j * 30 - now.minutes;
    let next = "";
    if (j < seq.length) {
      const nextState = seq[j];
      const at = (j >= 48 ? "завтра о " : "о ") + slotTime(j % 48);
      const verb = nextState === "on" ? "Увімкнуть " : nextState === "off" ? "Вимкнуть " : nextState === "maybe" ? "Можливе відключення " : "Далі немає даних ";
      next = verb + at + " · через " + duration(minsLeft);
    } else {
      next = (cur === "off" ? "Без світла до кінця доби" : cur === "on" ? "Без змін до кінця доби" : "Так до кінця доби") + (tomorrowKnown ? " і завтра" : "");
    }
    $("st-next").textContent = next;
    $("st-src").textContent = todayView.kind === "fact"
      ? "За графіком відключень на сьогодні"
      : "Графіка на сьогодні ще немає, показано тижневий план";
  }
  function renderControls(model, todayYmd) {
    const seg = $("regions");
    seg.replaceChildren();
    for (const r of REGIONS) {
      const b = el("button", "", r.name);
      b.type = "button";
      b.id = "region-" + r.id;
      b.setAttribute("aria-pressed", String(r.id === state.region));
      b.addEventListener("click", () => { state.region = r.id; state.group = null; save(); render(); loadLive(r.id); });
      seg.appendChild(b);
    }
    const sel = $("group");
    const groups = model ? groupsFor(model, todayYmd) : [];
    if (!groups.includes(state.group)) state.group = groups[0] || null;
    sel.replaceChildren();
    for (const g of groups) {
      const o = el("option", "", (model.names && model.names[g]) || g.replace(/^GPV/, "Черга "));
      o.value = g;
      if (g === state.group) o.selected = true;
      sel.appendChild(o);
    }
  }
  function save() {
    try { localStorage.setItem("svitlo-choice", JSON.stringify(state)); } catch (e) {}
  }

  function render() {
    const raw = live[state.region] || snapshot[state.region];
    const k = kyiv(new Date());
    const todayYmd = k.ymd, tomorrowYmd = addDays(k.ymd, 1);
    const now = { minutes: k.h * 60 + k.min, slot: k.h * 2 + (k.min >= 30 ? 1 : 0) };
    const model = raw ? buildModel(raw) : null;
    renderControls(model, todayYmd);

    const isLive = !!live[state.region];
    $("mode-dot").className = "dot" + (isLive ? " live" : "");
    $("mode-text").textContent = isLive ? "Живі дані з GitHub" : "Збережений знімок даних";

    if (!model || !state.group) {
      $("status").dataset.s = "unknown";
      $("st-big").textContent = "Немає даних";
      $("st-next").textContent = "Не вдалося отримати дані для цього регіону.";
      $("st-src").textContent = "";
      $("today").replaceChildren(); $("tomorrow").replaceChildren(); $("week").replaceChildren();
      $("fresh").textContent = "";
      return;
    }
    const tv = dayView(model, state.group, todayYmd, true);
    const mv = dayView(model, state.group, tomorrowYmd, true);
    renderStatus(tv, mv, now);
    renderDay($("today"), "Сьогодні", todayYmd, tv, now);
    renderDay($("tomorrow"), "Завтра", tomorrowYmd, mv, null);
    renderWeek(model, state.group, todayYmd);
    $("fresh").textContent = "Графік від постачальника: " + (model.factUpdate || "—") + " · дані зібрано: " + stamp(model.lastUpdated);
  }

  function loadLive(id) {
    if (liveTried[id]) return liveTried[id];
    const ctrl = typeof AbortController === "function" ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), 8000);
    liveTried[id] = fetch(RAW_BASE + id + ".json", { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(j => { live[id] = j; if (state.region === id) render(); })
      .catch(() => {})
      .finally(() => clearTimeout(timer));
    return liveTried[id];
  }

  $("group").addEventListener("change", e => { state.group = e.target.value; save(); render(); });
  render();
  loadLive(state.region);
  setInterval(render, 30000);
  setInterval(() => { delete liveTried[state.region]; loadLive(state.region); }, 5 * 60000);
})();
</script>
